<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GMarkDown</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css?v=2">
</head>
<body>
<div id="app" class="app">
    <header class="navbar">
        <a href="#/" class="navbar-brand" id="navbar-brand" hidden>
            <span class="logo-mark" aria-hidden="true">G</span>
            <span class="logo-text">GMarkDown</span>
        </a>
        <div class="navbar-spacer"></div>
        <div class="navbar-actions">
            <a class="ghost-btn" href="#/new" id="new-note-btn">
                <svg viewBox="0 0 24 24" width="1.25em" height="1.25em" aria-hidden="true">
                    <path fill="currentColor" d="M7,12H11V8H12V12H16V13H12V17H11V13H7V12M11.5,3C16.75,3 21,7.25 21,12.5C21,17.75 16.75,22 11.5,22C6.25,22 2,17.75 2,12.5C2,7.25 6.25,3 11.5,3M11.5,4C6.81,4 3,7.81 3,12.5C3,17.19 6.81,21 11.5,21C16.19,21 20,17.19 20,12.5C20,7.81 16.19,4 11.5,4Z"></path>
                </svg>
                <span>New Note</span>
            </a>
            <button class="ghost-btn" type="button" id="menu-btn" aria-haspopup="true" aria-expanded="false">
                <svg viewBox="0 0 24 24" width="1.25em" height="1.25em" aria-hidden="true">
                    <path fill="currentColor" d="M3,8V7H20V8H3M20,12V13H3V12H20M3,17H20V18H3V17Z"></path>
                </svg>
                <span>Menu</span>
            </button>
            <div class="menu" id="menu" hidden>
                <button type="button" id="upload-btn">Upload Markdown</button>
                <button type="button" id="theme-btn">Toggle dark mode</button>
            </div>
        </div>
    </header>
    <main id="view" class="view"></main>
</div>

<input id="upload-input" type="file" accept=".md,text/markdown" hidden>

<div id="toast-root" class="toast-root" aria-live="polite"></div>
<div id="modal-root"></div>

    <script src="js/app.js?v=2"></script>
</body>
</html>
